<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Kuidas veebirakendus päringu läbi töötleb"><title>Kuidas veebirakendus päringu läbi töötleb</title><defs><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker><marker id="ah-attack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ah-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ah-dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Üks päring: brauserist PHP-sse, andmebaasi ja tagasi</text><rect x="30" y="80" width="220" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="44" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">Brauser või curl</text><text x="44" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Windows 7 brauser</text><text x="44" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">või Kali: curl, Burp</text><rect x="370" y="80" width="240" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="384" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">hkhk-web</text><text x="384" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Apache + PHP</text><text x="384" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">nt ticket.php</text><text x="384" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">koostab SQL-i ja HTML-i</text><rect x="730" y="80" width="200" height="120" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="744" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">hkhk-db</text><text x="744" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">MariaDB</text><text x="744" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">tabelid users, tickets</text><path d="M250 112 L368 112" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-user)"/><circle cx="268" cy="98" r="11" fill="#2563eb"/><text x="268" y="102.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="285" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">HTTP-päring</text><path d="M610 112 L728 112" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ah-db)"/><circle cx="628" cy="98" r="11" fill="#0f766e"/><text x="628" y="102.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="645" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">SQL-päring</text><path d="M728 172 L610 172" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ah-db)"/><circle cx="628" cy="188" r="11" fill="#0f766e"/><text x="628" y="192.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="645" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">andmeread</text><path d="M368 172 L250 172" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-user)"/><circle cx="268" cy="188" r="11" fill="#2563eb"/><text x="268" y="192.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="285" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">HTTP-vastus</text><rect x="30" y="230" width="420" height="78.5" rx="8" fill="#0f172a"/><text x="42" y="254.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">GET /ticket.php?id=3 HTTP/1.1</tspan></text><text x="42" y="274.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#64748b" font-weight="400">Host: </tspan><tspan fill="#e2e8f0" font-weight="400">tugi.hkhk.internal:8000</tspan></text><text x="42" y="294.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#64748b" font-weight="400">Cookie: </tspan><tspan fill="#93c5fd" font-weight="400">PHPSESSID=abc123…</tspan></text><text x="30" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Päring: meetod, aadress, parameetrid, küpsis.</text><text x="30" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#dc2626" text-anchor="start">Kõike seda saab ründaja ise muuta (curl, Burp).</text><rect x="480" y="230" width="450" height="98.5" rx="8" fill="#0f172a"/><text x="492" y="254.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#86efac" font-weight="400">$ docker compose logs -f web</tspan></text><text x="492" y="274.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">[HKHK] user=mari TICKET VIEW id=3 uid=2</tspan></text><text x="492" y="294.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#86efac" font-weight="400">$ … tail -f /var/lib/mysql/general.log</tspan></text><text x="492" y="314.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">Query SELECT … FROM tickets WHERE id = 3</tspan></text><text x="480" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Logid näitavad, mida server iga päringuga tegi.</text><text x="480" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Nii tõendad, et rünne õnnestus või et parandus toimib.</text></svg>