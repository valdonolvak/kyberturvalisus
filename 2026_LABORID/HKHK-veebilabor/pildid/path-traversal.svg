ext x="30" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Konteineri failisüsteem</text><rect x="30" y="80" width="400" height="170.5" rx="8" fill="#0f172a"/><text x="42" y="104.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">/</tspan></text><text x="42" y="126.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">├── etc/</tspan></text><text x="42" y="148.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#64748b" font-weight="400">│   └── </tspan><tspan fill="#fca5a5" font-weight="700">passwd</tspan><tspan fill="#fca5a5" font-weight="400">          ← loetakse!</tspan></text><text x="42" y="170.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">└── var/www/html/</tspan><tspan fill="#64748b" font-weight="400">          ← veebijuur</tspan></text><text x="42" y="192.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#64748b" font-weight="400">    ├── </tspan><tspan fill="#fca5a5" font-weight="700">config.php</tspan><tspan fill="#fca5a5" font-weight="400">     ← DB parool!</tspan></text><text x="42" y="214.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#86efac" font-weight="700">    └── files/</tspan><tspan fill="#86efac" font-weight="400">        ← lubatud kaust</tspan></text><text x="42" y="236.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">        └── wifi-juhend.txt</tspan></text><text x="470" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Kuidas server tee kokku paneb</text><rect x="470" y="80" width="460" height="170.5" rx="8" fill="#0f172a"/><text x="482" y="104.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">/var/www/html/files/</tspan><tspan fill="#64748b" font-weight="400"> + </tspan><tspan fill="#fca5a5" font-weight="700">../../../../etc/passwd</tspan></text><text x="482" y="126.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400"></tspan></text><text x="482" y="148.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">../</tspan><tspan fill="#e2e8f0" font-weight="400">  →  /var/www/html</tspan></text><text x="482" y="170.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">../</tspan><tspan fill="#e2e8f0" font-weight="400">  →  /var/www</tspan></text><text x="482" y="192.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">../</tspan><tspan fill="#e2e8f0" font-weight="400">  →  /var</tspan></text><text x="482" y="214.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">../</tspan><tspan fill="#e2e8f0" font-weight="400">  →  /</tspan></text><text x="482" y="236.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">etc/passwd</tspan><tspan fill="#e2e8f0" font-weight="400">  →  </tspan><tspan fill="#fca5a5" font-weight="700">/etc/passwd</tspan></text><circle cx="486" cy="270" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><path d="M481.0 265.0 L491.0 275.0 M491.0 265.0 L481.0 275.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><text x="506" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">server loeb faili väljaspool lubatud kausta</text><rect x="30" y="306" width="84.2" height="21" rx="10.5" fill="#15803d"/><text x="72.1" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PARANDATUD</text><rect x="30" y="338" width="440" height="100" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><text x="46" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">1. Lubatud failide nimekiri</text><text x="46" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">ainult wifi-juhend.txt jt kindlad nimed;</text><text x="46" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">kõik muu → 404</text><rect x="490" y="338" width="440" height="100" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><text x="506" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">2. realpath() kontroll</text><text x="506" y="382" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#0f766e" font-weight="700">realpath(…)</tspan><tspan fill="#1f2937" font-weight="400"> = /etc/passwd</tspan></text><text x="506" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">kas algab /var/www/html/files/ ?  ei → 404</text><text x="506" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">../ ei aita, sest kontrollitakse lõplikku teed</text><text x="30" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Lubatud nimekiri on turvalisem kui keelatud märkide filtreerimine: filtrist saab mööda (..%2f, ....//), nimekirjast mitte.</text></svg>