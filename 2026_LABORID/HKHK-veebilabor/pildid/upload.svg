<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Piiramata faili üleslaadimine upload.php failis"><title>Piiramata faili üleslaadimine upload.php failis</title><defs><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker><marker id="ah-attack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ah-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ah-dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="960" height="520" fill="#ffffff"/><text x="30" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Faili üleslaadimine: PHP-fail maskeeritakse pildiks ja käivitatakse serveris</text><rect x="30" y="66" width="250" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="44" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start">Ründaja (Kali)</text><text x="44" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">laadib üles test-upload.php</text><text x="44" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">ja valetab päises:</text><text x="44" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Content-Type: image/png</text><rect x="355" y="66" width="250" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="369" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">upload.php</text><text x="369" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">kontrollib ainult päist:</text><text x="369" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">image/png?  ✓ „pilt“</text><text x="369" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">salvestab kasutaja nimega</text><rect x="680" y="66" width="250" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="694" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">veebijuur /uploads/</text><text x="694" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">/var/www/html/uploads/</text><text x="694" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">test-upload.php</text><text x="694" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">→ Apache käivitab .php</text><path d="M280 126 L353 126" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah-attack)"/><circle cx="316" cy="110" r="11" fill="#dc2626"/><text x="316" y="114.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M605 126 L678 126" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah-server)"/><circle cx="641" cy="110" r="11" fill="#475569"/><text x="641" y="114.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M805 186 L805 226 L155 226 L155 188" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-attack)"/><circle cx="480" cy="226" r="11" fill="#dc2626"/><text x="480" y="230.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="500" y="218" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start">GET /uploads/test-upload.php</text><rect x="30" y="250" width="900" height="58.5" rx="8" fill="#0f172a"/><text x="42" y="274.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#fca5a5" font-weight="700">HKHK LABOR: see PHP-kood kaivitati serveris!</tspan></text><text x="42" y="294.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">Kasutaja: www-data      Server: Linux … x86_64</tspan></text><circle cx="46" cy="334" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><path d="M41.0 329.0 L51.0 339.0 M51.0 329.0 L41.0 339.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><text x="66" y="339" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">4: ründaja kood töötab serveris (Remote Code Execution) – kõige raskem tagajärg</text><rect x="30" y="368" width="84.2" height="21" rx="10.5" fill="#15803d"/><text x="72.1" y="383" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PARANDATUD</text><rect x="30" y="400" width="292" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><circle cx="52" cy="424" r="11" fill="#ffffff" stroke="#15803d" stroke-width="2"/><path d="M48.0 424 L51.0 427.6363636363636 L56.705882352941174 420.3636363636364" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">finfo: tüüp sisu järgi</text><text x="72" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">sisu on text/x-php,</text><text x="72" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">mitte pilt → tagasi</text><rect x="334" y="400" width="292" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><circle cx="356" cy="424" r="11" fill="#ffffff" stroke="#15803d" stroke-width="2"/><path d="M352.0 424 L355.0 427.6363636363636 L360.70588235294116 420.3636363636364" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">server annab nime</text><text x="376" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">44cbfebb….png</text><text x="376" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">kasutaja nime ei kasutata</text><rect x="638" y="400" width="292" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/><circle cx="660" cy="424" r="11" fill="#ffffff" stroke="#15803d" stroke-width="2"/><path d="M656.0 424 L659.0 427.6363636363636 L664.7058823529412 420.3636363636364" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">väljaspool veebijuurt</text><text x="680" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">faili ei saa URL-iga avada;</text><text x="680" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">serveerib view.php</text><text x="30" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Content-Type päise kirjutab klient ise, seega ründaja saab sinna panna mida tahes. Usaldada saab ainult serveri enda kontrolli.</text></svg>