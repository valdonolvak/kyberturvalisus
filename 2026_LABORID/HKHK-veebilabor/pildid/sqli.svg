" width="70.56" height="21" rx="10.5" fill="#dc2626"/><text x="65.28" y="73" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">HAAVATAV</text><text x="30" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Tavaline sisselogimine: mari / mari123</text><rect x="30" y="108" width="760" height="38.5" rx="8" fill="#0f172a"/><text x="42" y="132.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">SELECT id, username, role FROM users WHERE username = '</tspan><tspan fill="#93c5fd" font-weight="700">mari</tspan><tspan fill="#e2e8f0" font-weight="400">' AND password = MD5('</tspan><tspan fill="#93c5fd" font-weight="700">mari123</tspan><tspan fill="#e2e8f0" font-weight="400">')</tspan></text><circle cx="812" cy="129" r="13" fill="#ffffff" stroke="#15803d" stroke-width="2"/><path d="M807.0 129 L810.75 133.54545454545453 L817.8823529411765 124.45454545454545" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="832" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="start">1 rida: mari</text><text x="30" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Rünne: kasutajanimeks  admin'-- -</text><rect x="30" y="188" width="760" height="38.5" rx="8" fill="#0f172a"/><text x="42" y="212.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#e2e8f0" font-weight="400">SELECT id, username, role FROM users WHERE username = '</tspan><tspan fill="#fca5a5" font-weight="700">admin'-- -</tspan><tspan fill="#64748b" font-weight="400" text-decoration="line-through">' AND password = MD5('suvaline')</tspan></text><circle cx="812" cy="209" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><path d="M807.0 204.0 L817.0 214.0 M817.0 204.0 L807.0 214.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><text x="832" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start">admin sisse</text><text x="832" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start">parooli teadmata</text><path d="M462 268 L462 238" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah-attack)"/><text x="40" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start">1. ülakoma ' sulgeb SQL-i teksti</text><text x="470" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start">2. -- alustab kommentaari: kõik edasi (parooli kontroll) jäetakse vahele</text><path d="M150 250 L440 238" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ah-attack)"/><rect x="30" y="296" width="84.2" height="21" rx="10.5" fill="#15803d"/><text x="72.1" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PARANDATUD</text><text x="30" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Parameetriseeritud päring: SQL-mall ja andmed saadetakse eraldi</text><rect x="30" y="346" width="760" height="58.5" rx="8" fill="#0f172a"/><text x="42" y="370.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#c4b5fd" font-weight="400">prepare: </tspan><tspan fill="#e2e8f0" font-weight="400">SELECT id, username, role FROM users WHERE username = </tspan><tspan fill="#86efac" font-weight="700">?</tspan><tspan fill="#e2e8f0" font-weight="400"> AND password = MD5(</tspan><tspan fill="#86efac" font-weight="700">?</tspan><tspan fill="#e2e8f0" font-weight="400">)</tspan></text><text x="42" y="390.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#c4b5fd" font-weight="400">execute: </tspan><tspan fill="#e2e8f0" font-weight="400">[ </tspan><tspan fill="#93c5fd" font-weight="700">"admin'-- -"</tspan><tspan fill="#e2e8f0" font-weight="400">, </tspan><tspan fill="#93c5fd" font-weight="700">"suvaline"</tspan><tspan fill="#e2e8f0" font-weight="400"> ]</tspan></text><circle cx="812" cy="377" r="13" fill="#ffffff" stroke="#15803d" stroke-width="2"/><path d="M807.0 377 L810.75 381.54545454545456 L817.8823529411765 372.45454545454544" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="832" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="start">0 rida: vale</text><text x="832" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="start">kasutaja/parool</text><text x="30" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Andmebaas teab ette, kus on kood ja kus andmed. admin'-- - on lihtsalt</text><text x="30" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">üks imelik kasutajanimi, mitte SQL-käsk, ja sellist kasutajat pole olemas.</text></svg>