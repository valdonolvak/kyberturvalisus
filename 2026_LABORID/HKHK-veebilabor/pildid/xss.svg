ke-width="2"/><path d="M501.0 386 L504.75 390.54545454545456 L511.88235294117646 381.45454545454544" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="start">brauser NÄITAB teksti, ei käivita seda</text><text x="526" y="409" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">+ CSP-päis keelab võõrad skriptid</text><text x="30" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">SQL-päring oli siin turvaline. Viga on väljundis: kasutaja tekst läks HTML-i ilma kodeerimata,</text><text x="30" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">nii et brauser ei saa aru, et see on andmed, mitte lehe kood.</text></svg>